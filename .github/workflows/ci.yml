name: CI

# Fast checks on every push and pull request: lint, the architecture invariants, the API suite
# without Docker markers (against a real Postgres with the repo's roles/init.sql), the runner unit
# tests and the web typecheck/build. The Docker-marked integration tests and Playwright E2E stay a
# local/pre-release gate (scripts/test-api.sh, apps/web/e2e) because they need sandbox images.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only secrets that satisfy the startup validation (>= 32 chars, not known dev defaults).
  CL_SECRET_KEY: ci-test-api-secret-0123456789abcdef
  CL_RUNNER_SECRET: ci-test-runner-secret-0123456789abcdef
  CL_DEMO_MODE: "false"

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.10
      - name: Lint
        run: ruff check services

  api:
    name: API tests (no Docker)
    runs-on: ubuntu-24.04
    # tests/conftest.py wipes and seeds the database before *every* test (autouse), so even the pure
    # architecture scan needs Postgres up and these URLs set.
    env:
      CL_DATABASE_URL: postgresql+asyncpg://cloudlabs_app:app@127.0.0.1:55432/cloudlabs_test
      CL_DATABASE_OWNER_URL: postgresql+asyncpg://cloudlabs_owner:owner@127.0.0.1:55432/cloudlabs_test
      CL_LABS_DIR: ${{ github.workspace }}/labs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements*.txt
      - name: Install dependencies
        working-directory: services/api
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Start Postgres (repo roles, cloudlabs + cloudlabs_test)
        run: |
          docker compose -f infra/docker-compose.yml up -d postgres
          for i in $(seq 1 30); do
            docker compose -f infra/docker-compose.yml exec -T postgres pg_isready -U postgres -d cloudlabs && exit 0
            sleep 2
          done
          echo "Postgres did not become ready" >&2
          exit 1
      - name: Migrate the test database
        working-directory: services/api
        run: python -m app.migrate
      - name: Architecture invariants (API never imports the Docker SDK)
        working-directory: services/api
        run: python -m pytest -q tests/test_architecture.py
      - name: Fast API suite
        working-directory: services/api
        run: python -m pytest -q -m "not docker"

  runner:
    name: Runner unit tests
    runs-on: ubuntu-24.04
    env:
      RUNNER_SECRET: ci-test-runner-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/runner/requirements*.txt
      - name: Install dependencies
        working-directory: services/runner
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests
        working-directory: services/runner
        run: python -m pytest -q -m "not docker"

  web:
    name: Web typecheck + build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Build
        working-directory: apps/web
        run: npm run build
