[pytest]
markers =
    docker: needs a Docker daemon
filterwarnings =
    # the legacy websockets server (uvicorn ws="websockets") is deprecated: serve with websockets-sansio
    error:websockets.legacy is deprecated:DeprecationWarning
    error:websockets.server.WebSocketServerProtocol is deprecated:DeprecationWarning
    error:remove second argument of ws_handler:DeprecationWarning
