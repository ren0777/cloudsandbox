# Isolation override for running this checkout next to the `cloudlabs` and `cloudlabs-authoring` projects.
#
#   COMPOSE_PROJECT_NAME=cloudlabs-m44 \
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.m44.yml --profile multi up -d --build
#
# Unique project name, host ports, runner ids, sandbox env, app image tags and terminal image tag, so
# containers, networks, volumes, runners and databases are never shared with another checkout.
# The emulator image tags are shared (same content, never rebuilt here).
services:
  postgres:
    ports: !override ["127.0.0.1:57432:5432"]
  gateway:
    ports: !override ["127.0.0.1:3200:3000"]

  runner:
    image: cloudlabs-m44/runner:dev
    environment:
      RUNNER_ID: runner-m44
      RUNNER_SECRET: dev-runner-m44-secret

  runner2:
    image: cloudlabs-m44/runner:dev
    environment:
      RUNNER_ID: runner-m44-2
      RUNNER_SECRET: dev-runner-m44-2-secret

  api:
    image: cloudlabs-m44/api:dev
    environment:
      CL_RUNNER_ID: runner-m44
      CL_RUNNER_SECRET: dev-runner-m44-secret
      CL_ENV: m44
      CL_ALLOWED_ORIGINS: '["http://localhost:3200"]'

  api-test:
    image: cloudlabs-m44/api:dev
    environment:
      CL_RUNNER_ID: runner-m44
      CL_RUNNER_SECRET: dev-runner-m44-secret
      CL_ENV: test
      CL_ALLOWED_ORIGINS: '["http://testserver", "http://localhost:3200"]'
      CL_RUNNER2_ID: runner-m44-2
      CL_RUNNER2_URL: http://runner2:7070
      CL_RUNNER2_SECRET: dev-runner-m44-2-secret

  web:
    image: cloudlabs-m44/web:dev
