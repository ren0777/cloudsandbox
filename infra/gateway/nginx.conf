# Single origin for the browser: UI, API and terminal WebSocket (keeps cookies first-party).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 3000;
  client_max_body_size 6m;
  server_tokens off;

  # Re-resolve the services through Docker's DNS instead of caching their IPs at startup: a recreated
  # api/web container (an upgrade, `up --build`) gets a new IP, and a static upstream would answer 502
  # until the gateway itself restarted. A variable in proxy_pass is what makes nginx resolve per request.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;
  set $web_upstream http://web:3000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Sandbox creation can run a full lab setup synchronously: the runner's job cap is 180 s and the
    # API's runner client waits up to 240 s, so the proxy must wait longer than both (CLI-heavy
    # break-action setups, e.g. a VPC network).
    proxy_read_timeout 300s;
  }
  location /ws/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 3600s;
  }
  location = /healthz { proxy_pass $api_upstream; }
  location / {
    proxy_pass $web_upstream;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
