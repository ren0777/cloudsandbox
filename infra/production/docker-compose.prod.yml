# Production overrides for the CONTROL-PLANE server (web, API, gateway, Postgres, optionally a local runner).
#
#   cp infra/production/production.env.example production.env      # fill in every secret
#   docker compose -f infra/docker-compose.yml -f infra/production/docker-compose.prod.yml \
#                  --env-file production.env up -d --build
#
# Differences from the laptop stack: no demo accounts, secrets from production.env, Postgres not published and
# with its own role passwords (paths below are relative to infra/), TLS on the gateway (80 → 443), runner2 test profile never started.
services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      CLOUDLABS_OWNER_PASSWORD: ${CLOUDLABS_OWNER_PASSWORD:?set CLOUDLABS_OWNER_PASSWORD}
      CLOUDLABS_APP_PASSWORD: ${CLOUDLABS_APP_PASSWORD:?set CLOUDLABS_APP_PASSWORD}
    volumes:
      - ./production/init-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro   # runs after 00-init.sql: sets real passwords
    restart: unless-stopped

  runner:
    restart: unless-stopped
    environment:
      RUNNER_SECRET: ${CL_RUNNER_SECRET:?set CL_RUNNER_SECRET}
      RUNNER_MAX_SANDBOXES: ${RUNNER_MAX_SANDBOXES:-8}

  api:
    restart: unless-stopped
    environment:
      CL_DATABASE_URL: postgresql+asyncpg://cloudlabs_app:${CLOUDLABS_APP_PASSWORD}@postgres:5432/cloudlabs
      CL_DATABASE_OWNER_URL: postgresql+asyncpg://cloudlabs_owner:${CLOUDLABS_OWNER_PASSWORD}@postgres:5432/cloudlabs
      CL_SECRET_KEY: ${CL_SECRET_KEY:?set CL_SECRET_KEY}
      CL_RUNNER_SECRET: ${CL_RUNNER_SECRET:?set CL_RUNNER_SECRET}
      CL_ALLOWED_ORIGINS: '["https://${PUBLIC_HOST:?set PUBLIC_HOST}"]'
      CL_COOKIE_SECURE: "true"
      CL_DEMO_MODE: "false"
      CL_ENV: prod
    labels:
      cloudlabs.role: control-plane
      cloudlabs.env: prod

  web:
    restart: unless-stopped

  gateway:
    restart: unless-stopped
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./production/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_DIR:?set TLS_DIR (folder with fullchain.pem and privkey.pem)}:/etc/nginx/tls:ro
      - ${ACME_DIR:-./production/acme}:/var/www/acme:ro
