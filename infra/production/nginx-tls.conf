# CloudLabs gateway with TLS (production). Mount as /etc/nginx/conf.d/default.conf in the gateway container and
# the certificate files under /etc/nginx/tls/. See docs/DEPLOYMENT.md "TLS".
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name labs.example.edu;
  location /.well-known/acme-challenge/ { root /var/www/acme; }   # certificate renewal (certbot webroot)
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name labs.example.edu;
  ssl_certificate     /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  client_max_body_size 6m;
  server_tokens off;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 180s;
  }
  location /ws/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 3600s;
  }
  location = /healthz { proxy_pass http://api:8000/healthz; }
  location /metrics { return 404; }   # Prometheus scrapes the API on the internal network only
  location / {
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
